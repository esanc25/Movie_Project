{% extends "base.html" %}
{% block title %}Add Book{% endblock %}
{% block content %}
    <h1>New Book?</h1>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('add') }}"> 
        <p>
            <label for="title">Title</label><br>
            <input id="title" name="title" placeholder="Book Title">
        </p>

        <p>
            <label for="author">Author</label><br>
            <input id="author" name="author" placeholder="Author Name">
        </p>
        
        <p>
            <label for="release_year">Release Year</label><br>
            <input type="number" id="release_year" name="release_year" placeholder="Release year">
        </p>

        <p>
            <label for="page_length">Page Length</label><br>
            <input type="number" id="page_length" name="page_length" placeholder="Page length">
        </p>

        <p>
            <label for="description">Short Summary</label><br>
            <input id="description" name="description" placeholder="Summary">
        </p>

        <p>
            <label for="image_url">Cover Image</label><br>
            <input id="image_url" name="image_url" type="link" placeholder="Paste image url">
        </p>

        <button type="submit">Send</button>
    </form>

{% endblock %}
